<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Thanh Nguyen Chi (Ken) — Code by day, break by night. Senior Developer, 10 years, Hanoi, Vietnam">
  <defs>
    <!-- Same brand ramp, darkened ~18% to hold AA contrast on white. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97F0A"/>
      <stop offset="50%" stop-color="#D2431F"/>
      <stop offset="100%" stop-color="#C41E45"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#24292F" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#FFFFFF"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Motion streaks; no bloom here — glow reads as blur on a light background. -->
  <g opacity="0.55">
    <rect x="60"   y="-140" width="4"  height="600" transform="rotate(24 62 160)"   fill="#C97F0A" opacity="0.30"/>
    <rect x="104"  y="-140" width="2"  height="600" transform="rotate(24 105 160)"  fill="#C97F0A" opacity="0.18"/>
    <rect x="1080" y="-140" width="4"  height="600" transform="rotate(24 1082 160)" fill="#C41E45" opacity="0.30"/>
    <rect x="1136" y="-140" width="2"  height="600" transform="rotate(24 1137 160)" fill="#C41E45" opacity="0.18"/>
  </g>

  <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>

  <text x="600" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing="7" fill="#C41E45">THANH NGUYEN CHI &#183; KEN</text>

  <text x="600" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="1.5" fill="url(#brand)">CODE BY DAY &#183; BREAK BY NIGHT</text>

  <rect x="440" y="220" width="320" height="2" fill="url(#brand)" opacity="0.7"/>

  <text x="600" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" fill="#57606A">Senior Developer &#160;&#183;&#160; 10 years &#160;&#183;&#160; Hanoi, Vietnam</text>

  <text x="600" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="3" fill="#6E7681">WEB &#183; MOBILE &#183; UI/UX &#183; GAMES</text>
</svg>
