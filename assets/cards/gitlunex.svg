<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 156" width="440" height="156" role="img" aria-label="GitLunex v1.0.0 — lightweight cross-platform Git GUI with commit graph, embedded terminal and tabbed repo workspace. Tauri, React, TypeScript.">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9A622"/>
      <stop offset="50%" stop-color="#F05B42"/>
      <stop offset="100%" stop-color="#EE3F5C"/>
    </linearGradient>
    <clipPath id="card"><rect width="440" height="156" rx="10"/></clipPath>
  </defs>

  <!-- Dark card on both GitHub themes, matching the badge chips. -->
  <g clip-path="url(#card)">
    <rect width="440" height="156" fill="#1B1F24"/>
    <rect width="5" height="156" fill="url(#brand)"/>
  </g>
  <rect x="0.5" y="0.5" width="439" height="155" rx="10" fill="none" stroke="#30363D"/>

  <!-- Repo glyph, same 24x24 stroke language as the section icons. -->
  <g transform="translate(26 26) scale(0.75)" fill="none" stroke="#F05B42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/>
  </g>

  <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" fill="#E6EDF3">GitLunex</text>

  <!-- Version pill. Static: bump this on release (see README comment). -->
  <rect x="352" y="20" width="62" height="22" rx="11" fill="#22262C" stroke="#30363D"/>
  <text x="383" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#8B949E">v1.0.0</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8B949E">
    <text x="26" y="76">Cross-platform local Git GUI &#8212; commit graph,</text>
    <text x="26" y="96">embedded terminal, tabbed repo workspace.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6E7681">
    <circle cx="31" cy="126" r="5" fill="#4493F8"/>
    <text x="43" y="130">Tauri</text>
    <circle cx="106" cy="126" r="5" fill="#4493F8"/>
    <text x="118" y="130">React</text>
    <circle cx="186" cy="126" r="5" fill="#4493F8"/>
    <text x="198" y="130">TypeScript</text>
  </g>
</svg>
