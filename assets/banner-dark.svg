<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Thanh Nguyen Chi (Ken) — Code by day, break by night. Senior Developer, 10 years, Hanoi, Vietnam">
  <defs>
    <!-- Brand ramp lifted from the "ik" logo: amber to coral to crimson. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F9A622"/>
      <stop offset="50%" stop-color="#F05B42"/>
      <stop offset="100%" stop-color="#EE3F5C"/>
    </linearGradient>
    <!-- Soft bloom behind the headline so the type glows instead of sitting flat. -->
    <filter id="bloom" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <!-- Faint dot grid evokes a dance-floor / terminal texture without stealing focus. -->
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6EDF3" opacity="0.06"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0D1117"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Diagonal streaks: motion lines, a nod to the break-dancing half. -->
  <g opacity="0.5">
    <rect x="60"   y="-140" width="4"  height="600" transform="rotate(24 62 160)"   fill="#F9A622" opacity="0.35"/>
    <rect x="104"  y="-140" width="2"  height="600" transform="rotate(24 105 160)"  fill="#F9A622" opacity="0.20"/>
    <rect x="1080" y="-140" width="4"  height="600" transform="rotate(24 1082 160)" fill="#EE3F5C" opacity="0.35"/>
    <rect x="1136" y="-140" width="2"  height="600" transform="rotate(24 1137 160)" fill="#EE3F5C" opacity="0.20"/>
  </g>

  <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>

  <text x="600" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing="7" fill="#EE3F5C" opacity="0.9">THANH NGUYEN CHI &#183; KEN</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <text x="600" y="188" fill="url(#brand)" filter="url(#bloom)" opacity="0.75">CODE BY DAY &#183; BREAK BY NIGHT</text>
    <text x="600" y="188" fill="url(#brand)">CODE BY DAY &#183; BREAK BY NIGHT</text>
  </g>

  <rect x="440" y="220" width="320" height="2" fill="url(#brand)" opacity="0.6"/>

  <text x="600" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" fill="#8B949E">Senior Developer &#160;&#183;&#160; 10 years &#160;&#183;&#160; Hanoi, Vietnam</text>

  <text x="600" y="296" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="3" fill="#6E7681">WEB &#183; MOBILE &#183; UI/UX &#183; GAMES</text>
</svg>
